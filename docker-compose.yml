services:
  db:
    image: mysql:8.0
    container_name: scholarflex-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-scholarflex}
      MYSQL_USER: ${DB_USER:-scholarflex}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: scholarflex-backend:latest
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${DB_USER:-scholarflex}:${DB_PASSWORD}@host.docker.internal:3306/${DB_NAME:-scholarflex}
      ENABLE_CLUSTER: "false"
      DATABASE_CONNECTION_LIMIT: "20"
      DATABASE_POOL_TIMEOUT: "20"
    depends_on:
      db:
        condition: service_healthy
    restart: always
volumes:
  mysql_data:
