version: "3.9"

services:
  db:
    image: postgres:16
    container_name: scholarflex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scholarflex
      POSTGRES_PASSWORD: scholarflex
      POSTGRES_DB: scholarflex
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: node-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: react-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
