services:
  db:
    image: mysql:8.0
    container_name: scholarflex-db
    environment:
      # Use environment variables from .env file (not committed to git)
      # Create .env file with: DB_ROOT_PASSWORD, DB_NAME, DB_USER, DB_PASSWORD
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-scholarflex}
      MYSQL_USER: ${DB_USER:-scholarflex}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: scholarflex-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # DATABASE_URL will be built from .env variables
      # Using host.docker.internal to connect to local MySQL (Windows/Mac)
      # For Linux, use the host's IP or 'host.docker.internal' if available
      # Note: Password with special characters like @ need to be URL-encoded (%40 for @)
      # If DB_PASSWORD contains @, it should be URL-encoded in .env file
      DATABASE_URL: mysql://${DB_USER:-scholarflex}:${DB_PASSWORD}@host.docker.internal:3306/${DB_NAME:-scholarflex}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  mysql_data:
